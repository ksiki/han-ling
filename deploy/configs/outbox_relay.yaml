input:
  generate:
    interval: 2s
    mapping: 'root = {}'
  processors:
    - sql_raw:
        driver: postgres
        dsn: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${TARGET_DB_NAME}?sslmode=disable
        query: >
          SELECT id, exchange, routing_key, payload
          FROM outbox_messages
          WHERE status = 'PENDING'
          ORDER BY created_at ASC
          LIMIT 15;

    - unarchive:
        format: json_array

    - catch:
      - mapping: 'root = deleted()'

    - mapping: |
        meta msg_id = this.id
        meta out_exchange = this.exchange
        meta out_routing_key = this.routing_key
        root = this.payload

output:
  broker:
    pattern: fan_out
    outputs:
      - amqp_0_9:
          urls:
            - amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
          exchange: ${!meta("out_exchange")}
          key: ${!meta("out_routing_key")}
          max_in_flight: 1
          exchange_declare:
            enabled: true
            type: topic

      - sql_raw:
          driver: postgres
          dsn: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${TARGET_DB_NAME}?sslmode=disable
          query: "UPDATE outbox_messages SET status = 'PUBLISHED', processed_at = NOW() WHERE id = $1;"
          args_mapping: "root = [ meta(\"msg_id\") ]"
