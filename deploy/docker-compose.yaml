services:
  database:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  # ---------------------------------------------
  # S3 Storage
  # ---------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret}
      MINIO_SERVER_URL: "https://hanling.local/s3"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  minio_setup:
    image: quay.io/minio/mc:latest
    container_name: minio_setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret}
    entrypoint: >
      /bin/sh -c "
      echo 'Connecting to MinIO...';
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      echo 'Creating bucket...';
      mc mb myminio/temp-files --ignore-existing;
      echo 'Setup completed successfully. Exiting.';
      exit 0;
      "
    networks:
      - local_network

  # ---------------------------------------------
  # Message Broker
  # ---------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  # ---------------------------------------------
  # Auth Service
  # ---------------------------------------------
  auth_service:
    build:
      context: ../
      dockerfile: auth_service/Dockerfile
    container_name: auth_service
    restart: unless-stopped
    env_file: .env
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../auth_service/src:/app/src
      - ../shared:/shared
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  auth_outbox_relay:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: auth_outbox_relay
    restart: unless-stopped
    env_file: .env
    environment:
      - TARGET_DB_NAME=${AUTH_SERVICE_POSTGRES_DB}
    volumes:
      - ./configs/outbox_relay.yaml:/connect.yaml:ro
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  # ---------------------------------------------
  # Frontend
  # ---------------------------------------------
  frontend:
    build:
      context: ../frontend
      target: development
    container_name: frontend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../frontend:/app
      - frontend_data:/app/data
      - frontend_node_modules:/app/node_modules
    networks:
      - local_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------
  # Web Server
  # ---------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - local_network

  # ---------------------------------------------
  # Observability Agent
  # ---------------------------------------------
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    privileged: true
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --cluster.enabled=false
    ports:
      - "127.0.0.1:12345:12345"
    env_file: .env
    volumes:
      - ./configs/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    environment:
      - ALLOY_ENV=production
      - GOMEMLIMIT=80MiB
    deploy:
      resources:
        limits:
          memory: 100M
    networks:
    - local_network

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  minio_data:
  rabbitmq_data:
  frontend_data:
  frontend_node_modules:

networks:
  local_network:
    driver: bridge
