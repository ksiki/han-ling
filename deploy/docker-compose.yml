services:
  database:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hanling_network  

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hanling_network

  # ---------------------------------------------
  # Auth Service
  # ---------------------------------------------
  auth_service:
    build:
      context: ../
      dockerfile: auth_service/Dockerfile
    container_name: auth_service
    restart: unless-stopped
    env_file: .env
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../auth_service/src:/app/src
      - ../shared:/shared
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hanling_network

  # ---------------------------------------------
  # Web Server
  # ---------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hanling_network


volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  hanling_network:
    driver: bridge