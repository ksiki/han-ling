[project]
name = "auth-service"
version = "0.1.0"
description = ""
authors = [
    {name = "ksiki",email = "j.kolyasha@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "shared @ file:../shared",
    "redis (>=8.1.0,<9.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "google-auth (>=2.58.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
ruff = "^0.16.7"
mypy = "^2.3.1"
respx = "^0.23.1"
pytest-mock = "^3.15.1"


[tool.poetry.dependencies]
shared = {develop = true}


[tool.pytest.ini_options]
asyncio_mode = "auto"


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
